[project]
authors = [
    { name = "Simon van Lierde", email = "simonvanlierde@gmail.com" },
    { name = "Leon Ferrari", email = "leon.ferrari@vub.be" },
    { name = "Johanna Haupt", email = "johanna.haupt@tu-braunschweig.de" },
    { name = "Samaneh Fayyaz", email = "sfay@igt.sdu.dk" },
    { name = "Kira Fischer", email = "kira.fischer@ist.fraunhofer.de" },
]
name = "batterway"
maintainers = [{ name = "Simon van Lierde", email = "simonvanlierde@gmail.com" }]
description = "Batterway LCA models for Depart de Sentier vocabularies"
readme = "README.md"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "chempy",
    "pandas",
    # sentier_data_tools imports SqliteExtDatabase from playhouse, which peewee 4 dropped.
    # A direct pin, not a uv-only constraint.
    "peewee<4",
    "pydantic>=2",
    "rdflib>=7",
    "sentier_data_tools"
]

[project.urls]
source   = "https://github.com/simonvanlierde/batterway"
homepage = "https://github.com/simonvanlierde/batterway"
tracker  = "https://github.com/simonvanlierde/batterway/issues"

[project.optional-dependencies]
testing = ["pytest", "pytest-cov", "python-coveralls"]
dev     = ["pre-commit", "pylint", "pytest", "pytest-cov", "pytest-randomly"]

[tool.pytest.ini_options]
addopts       = "--cov batterway --cov-report term-missing --cov-report xml --verbose"
norecursedirs = [".tox", "build", "dist"]
testpaths     = ["tests"]
# Not an installed package: tests import batterway from the repo root.
pythonpath    = ["."]

[tool.flake8]
# Some sane defaults for the code style checker flake8
max_line_length = 88
extend_ignore   = ["E203", "W503"]
# ^  Black-compatible
#    E203 and W503 have edge cases handled by black
exclude = [".eggs", ".tox", "build", "dist", "docs/conf.py"]

[tool.black]
line-length = 88

[tool.isort]
profile                        = "black"
line_length                    = 88
multi_line_output              = 3
include_trailing_comma         = true
force_grid_wrap                = 0
use_parentheses                = true
ensure_newline_before_comments = true

[tool.ruff.lint]
# Pyflakes plus the core pycodestyle errors; the style rules stay off for this prototype.
select = ["E4", "E7", "E9", "F"]
