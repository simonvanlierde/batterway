name: cold install

on:
  pull_request:
    paths:
      - .github/workflows/cold-install.yml
      - .python-version
      - README.md
      - pyproject.toml
      - uv.lock
      - main.py
      - "batterway/**"
      - "data/dataframes/**"
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install and run the README example in a fresh container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: buildpack-deps:trixie@sha256:5214476af627916270063c9f99a969381f32cd961c861ea95e740ba71abc125f
    env:
      UV_MALWARE_CHECK: "1"
      UV_PREVIEW_FEATURES: malware-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run --no-sync python main.py
