[project]
name = "batterway"
version = "0.0.1"
description = "Batterway LCA models for Depart de Sentier vocabularies"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Simon van Lierde", email = "simonvanlierde@gmail.com" },
    { name = "Leon Ferrari", email = "leon.ferrari@vub.be" },
    { name = "Johanna Haupt", email = "johanna.haupt@tu-braunschweig.de" },
    { name = "Samaneh Fayyaz", email = "sfay@igt.sdu.dk" },
    { name = "Kira Fischer", email = "kira.fischer@ist.fraunhofer.de" },
]
maintainers = [{ name = "Simon van Lierde", email = "simonvanlierde@gmail.com" }]
license = "GPL-3.0-or-later"
dependencies = [
    "chempy",
    "pandas",
    # sentier_data_tools imports SqliteExtDatabase from playhouse, which peewee 4 dropped.
    # A direct pin, not a uv-only constraint.
    "peewee<4",
    "pydantic>=2",
    "rdflib>=7",
    "sentier_data_tools",
]
# PyPI rejects unknown classifiers, so this one blocks an accidental upload.
# Delete it (and set publish_to_pypi) to publish.
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Source = "https://github.com/simonvanlierde/batterway"
Homepage = "https://github.com/simonvanlierde/batterway"
Issues = "https://github.com/simonvanlierde/batterway/issues"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "ty>=0.0.84",
]
docs = [
  "myst-parser>=4.0.0",
  "sphinx>=8.1.0",
  "sphinx-autoapi>=3.4.0",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinx-rtd-theme>=3.0.0",
]

# Research projects are packaged too, so notebooks can `import batterway`
# without sys.path edits.
[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. Dependabot's cooldown waits the same. Set here,
# not user-wide, so every machine writes the same uv.lock.
[tool.uv]
exclude-newer = "1 week"
# NOTE: pillow 13.0, certifi 2026.10.19 and setuptools 84.1.0 fix advisories that `uv audit`
# fails CI on; drop this once they are a week old.
exclude-newer-package = { pillow = false, certifi = false, setuptools = false }

# uv_build derives the package dir from the normalized project.name, so pin it
# for a module_name that differs.
[tool.uv.build-backend]
module-name = "batterway"
module-root = ""

# NOTE: self-contained ruff config, deliberately not extended from any shared base.
# No target-version: ruff derives it from requires-python above.
[tool.ruff]
line-length = 88
# Archived notebooks are data; docs/ waits for the docs-build fix.
extend-exclude = ["data", "docs"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Pyflakes plus the core pycodestyle errors; the style rules stay off for this prototype.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
# Not an installed package under test discovery: tests import batterway from the repo root.
pythonpath = ["."]

# Coverage is opt-in via `pytest --cov` (`just py-cov`), not addopts, because it
# slows every plain test run. No fail_under until there is a suite worth setting
# one against.
[tool.coverage.run]
source = ["batterway"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# NOTE: baseline for the prototype's type errors (37 at adoption). They stay warnings so
# `ty check` gates new rules, not this backlog. Fix them, then delete this table.
[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
invalid-method-override = "warn"
invalid-return-type = "warn"
invalid-type-form = "warn"
missing-argument = "warn"
no-matching-overload = "warn"
too-many-positional-arguments = "warn"
unresolved-attribute = "warn"
unsupported-operator = "warn"

[tool.ty.terminal]
error-on-warning = false
