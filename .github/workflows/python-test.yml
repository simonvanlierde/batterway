---
# This workflow will install Python dependencies and run tests
# across operating systems, select versions of Python, and user + dev environments
# For more info see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python 🐍 CI/CD tests

on:
  push:
    branches: [main, develop]
    paths-ignore:  # prevents workflow execution when only these types of files are modified
      - "**.md"  # wildcards prevent file in any repo dir from trigering workflow
      - "**.bib"
      - "**.ya?ml"  # captures both .yml and .yaml
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, develop]
    types: [opened, reopened]  # excludes syncronize to avoid redundant trigger from commits on PRs
    paths-ignore:
      - "**.md"
      - "**.bib"
      - "**.ya?ml"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:  # also allow manual trigger, for testing purposes

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # Codecov upload signs in with the run's OIDC token; the repo has no CODECOV_TOKEN
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-22.04]
        py-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.py-version }}

      - name: Install test deps
        run: uv sync --locked --extra testing

      - name: Test with pytest
        run: uv run pytest

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
